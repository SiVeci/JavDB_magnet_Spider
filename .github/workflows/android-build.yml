name: Android Build & Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v1.0.0)'
        required: false
        default: 'manual-build'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Python tests
        run: |
          pip install -r requirements.txt
          pip install httpx
          python -m unittest discover -s spider_core/tests
      - name: Guard Pydantic v1/v2 compatibility
        run: |
          if grep -rnE '(model_dump|model_validate|model_config|ConfigDict|field_validator|parse_obj|parse_raw)' spider_core --include='*.py'; then
            echo "::error::Found Pydantic version-specific API; keep schemas in the v1/v2 common subset."
            exit 1
          fi
          echo "Pydantic compatibility guard passed."
      - name: Inject Version Tag
        run: |
          set -euo pipefail
          sed -i 's/JAVDB_SPIDER_VERSION", "[^"]*"/JAVDB_SPIDER_VERSION", "${{ github.event.inputs.version }}"/' spider_core/app_config.py
          grep -q 'JAVDB_SPIDER_VERSION", "${{ github.event.inputs.version }}"' spider_core/app_config.py
      - name: Generate signing config (local.properties)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing Android signing secrets."
            exit 1
          fi
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> local.properties
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          rm -f app/javdb_spider.jks
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/javdb_spider.jks
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend (生成 frontend_dist 供 Chaquopy 打包)
        run: |
          cd spider_core/web
          npm ci
          npm run build
      - name: Build Release APK
        run: ./gradlew assembleRelease
      - name: Rename APK File
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/JavDB-Spider_${{ github.event.inputs.version }}_android_arm64-v8a.apk
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/JavDB-Spider_${{ github.event.inputs.version }}_android_arm64-v8a.apk
          ls -lh "$APK"
          unzip -t "$APK" > /dev/null
          echo "APK integrity OK."
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavDB-Spider_${{ github.event.inputs.version }}_android_arm64-v8a
          path: app/build/outputs/apk/release/JavDB-Spider_${{ github.event.inputs.version }}_android_arm64-v8a.apk

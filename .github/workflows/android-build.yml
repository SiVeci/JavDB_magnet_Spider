name: Android Build & Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v1.0.0)'
        required: false
        default: 'manual-build'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Inject Version Tag
        run: |
          sed -i "s/\"dev-local\"/\"${{ github.event.inputs.version }}\"/g" spider_core/main.py
      - name: Build Release APK
        run: ./gradlew assembleRelease
      - name: Rename APK File
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/JavDB-Spider_${{ github.event.inputs.version }}_android_arm64-v8a.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavDB-Spider_${{ github.event.inputs.version }}_android_arm64-v8a
          path: app/build/outputs/apk/release/JavDB-Spider_${{ github.event.inputs.version }}_android_arm64-v8a.apk
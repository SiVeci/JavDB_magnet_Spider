name: Docker Publish Auth Browser to GHCR (Manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入发布的版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
env:
  REGISTRY: ghcr.io
  IMAGE_NAME_AUTH_BROWSER: ${{ github.repository_owner }}/javdb_auth_browser
jobs:
  build-and-push-auth-browser-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Auth Browser
        id: meta_auth_browser
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AUTH_BROWSER }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=raw,value=latest
      - name: Build and push Auth Browser image
        uses: docker/build-push-action@v5
        with:
          context: ./auth_browser
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta_auth_browser.outputs.tags }}
          labels: ${{ steps.meta_auth_browser.outputs.labels }}
          cache-from: type=gha,scope=auth_browser
          cache-to: type=gha,mode=max,scope=auth_browser

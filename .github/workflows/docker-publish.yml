name: Docker Publish to GHCR (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入发布的版本号 (例如: v1.0.1)'
        required: true
        default: 'v1.0.1' # 建议把默认值改成具体的版本格式提醒自己

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/javdb_spider 

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 注入真实的版本号 (例如 v1.0.1) 到 Python 源码中
      - name: Inject Version Tag
        run: |
          sed -i "s/\"dev-local\"/\"${{ github.event.inputs.version }}\"/g" spider_core/main.py

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成双重标签
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
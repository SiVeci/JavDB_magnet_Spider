<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavDB Magnet Spider</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
    <section id="authGate" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950 text-slate-100 p-4">
        <div class="w-full max-w-sm space-y-4">
            <div class="flex flex-col items-center gap-3 text-center">
                <img src="/favicon.png" alt="Logo" class="w-12 h-12 rounded-lg">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">JavDB Magnet Spider</h1>
                    <p class="mt-1 text-sm text-slate-400">输入访问令牌后继续</p>
                </div>
            </div>
            <div class="space-y-3">
                <input id="auth_token" type="password" autocomplete="off" placeholder="访问令牌" onkeydown="handleAuthTokenKeydown(event)" class="w-full border border-slate-700 bg-slate-900 rounded p-3 text-sm text-slate-100 outline-none focus:border-indigo-400">
                <button id="auth_submit" type="button" onclick="saveAuthToken()" class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-700 disabled:text-slate-400 text-white font-bold px-4 py-3 rounded">验证</button>
                <div id="auth_error" class="hidden text-sm text-red-300 text-center"></div>
            </div>
        </div>
    </section>

    <main id="appShell" class="hidden max-w-7xl mx-auto space-y-6">
        <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div class="flex flex-col items-center gap-2 md:items-start">
                <div class="flex items-center gap-3">
                    <img src="/favicon.png" alt="Logo" class="w-10 h-10 rounded-lg">
                    <h1 class="text-3xl font-bold tracking-tight">JavDB Magnet Spider</h1>
                </div>
                <span id="app_version" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-1 rounded">加载中...</span>
            </div>
            <nav class="grid grid-cols-3 rounded-lg border border-slate-200 bg-white p-1 text-sm font-bold shadow-sm md:w-80" aria-label="主导航">
                <button id="nav-tasks" type="button" onclick="navigateToView('tasks')" class="rounded-md px-3 py-2 text-slate-600 hover:bg-slate-50">任务</button>
                <button id="nav-database" type="button" onclick="navigateToView('database')" class="rounded-md px-3 py-2 text-slate-600 hover:bg-slate-50">数据库</button>
                <button id="nav-settings" type="button" onclick="navigateToView('settings')" class="rounded-md px-3 py-2 text-slate-600 hover:bg-slate-50">设置</button>
            </nav>
        </header>

        <section id="view-tasks" data-view="tasks" class="grid min-h-0 grid-cols-1 content-start items-start gap-4 overflow-hidden xl:grid-cols-[430px_1fr] xl:gap-6">
            <div id="taskConfigPanel" class="shrink-0 space-y-2 overflow-visible">
                <section class="bg-white border border-slate-200 rounded-lg overflow-hidden">
                    <div class="px-5 py-1.5 border-b border-slate-100">
                        <h2 class="text-lg font-semibold">任务配置</h2>
                    </div>
                    <div class="px-5 py-2 space-y-2 text-sm">
                        <div>
                            <label class="block mb-1 text-slate-600">起始页面 URL</label>
                            <div class="flex gap-2">
                                <input id="start_url" type="text" class="flex-1 border border-slate-300 rounded p-2" placeholder="https://javdb.com/actors/...">
                                <button type="button" onclick="fetchTags()" class="px-3 py-2 rounded bg-indigo-50 text-indigo-700 font-bold border border-indigo-100">标签</button>
                            </div>
                            <div id="tags-wrapper" class="hidden mt-3 border border-indigo-100 rounded overflow-hidden">
                                <button type="button" onclick="toggleTagsPanel()" class="w-full bg-indigo-50 px-3 py-2 text-xs font-bold text-indigo-700 flex items-center justify-between">
                                    <span>标签过滤</span>
                                    <span id="tags-toggle-icon">▲</span>
                                </button>
                                <div id="tags-list" class="p-3 flex flex-wrap gap-2"></div>
                            </div>
                        </div>
                        <div>
                            <label class="block mb-1 text-slate-600">自定义任务/文件名</label>
                            <div class="flex gap-2">
                                <input id="filename" type="text" class="min-w-0 flex-1 border border-slate-300 rounded p-2" placeholder="留空则入队时自动命名">
                                <button id="addTaskBtn" type="button" onclick="addTask()" title="添加到任务列表" aria-label="添加到任务列表" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded bg-blue-600 text-white hover:bg-blue-700">
                                    <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
                                        <path d="M12 5v14"></path>
                                        <path d="M5 12h14"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

            </div>

            <section id="taskMonitorCard" class="flex min-h-0 flex-col overflow-hidden rounded-lg border border-slate-200 bg-white">
                <div class="px-5 py-1.5 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="text-lg font-semibold">任务监控</h2>
                    <button onclick="refreshMonitor()" class="text-xs px-3 py-1.5 bg-slate-50 hover:bg-slate-100 rounded font-bold">刷新</button>
                </div>
                <div id="taskMonitorBody" class="grid min-h-0 flex-1 content-start grid-cols-1 items-start overflow-hidden lg:grid-cols-[280px_1fr]">
                    <aside id="taskQueuePanel" class="min-h-0 self-start overflow-hidden border-r border-slate-100 bg-slate-50">
                        <div id="taskQueueToolbar" class="px-4 py-1.5 border-b border-slate-200">
                            <div class="flex items-center gap-2">
                                <button id="startQueueBtn" onclick="startQueue()" title="开始任务队列" aria-label="开始任务队列" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed">
                                    <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor">
                                        <path d="M8 5.5v13l10-6.5-10-6.5z"></path>
                                    </svg>
                                </button>
                                <div id="queueTaskControlSlot" class="shrink-0"></div>
                                <button id="toggleFinishedBtn" type="button" onclick="toggleFinishedTasks()" title="显示已结束" aria-label="显示已结束" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded bg-slate-100 text-slate-700 hover:bg-slate-200">
                                    <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 6h18"></path>
                                        <path d="M3 12h18"></path>
                                        <path d="M3 18h18"></path>
                                    </svg>
                                </button>
                                <button id="cleanupFinishedBtn" type="button" onclick="cleanupFinishedTasks()" title="清理已结束" aria-label="清理已结束" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded bg-red-50 text-red-700 hover:bg-red-100 disabled:opacity-40 disabled:cursor-not-allowed">
                                    <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M3 6h18"></path>
                                        <path d="M8 6V4h8v2"></path>
                                        <path d="M6 6l1 15h10l1-15"></path>
                                        <path d="M10 11v6"></path>
                                        <path d="M14 11v6"></path>
                                    </svg>
                                </button>
                                <div id="queueSummary" class="flex h-10 min-w-0 flex-col justify-center text-xs leading-4 text-slate-500">加载中...</div>
                            </div>
                        </div>
                        <div id="task-list" class="divide-y divide-slate-200 overflow-y-auto log-box">
                            <div class="p-4 text-center text-slate-400 text-sm">暂无任务</div>
                        </div>
                    </aside>

                    <section id="taskLogPanel" class="flex min-h-0 self-start flex-col gap-3 overflow-hidden p-5">
                        <div id="currentActions" class="hidden flex-wrap gap-2"></div>

                        <div id="taskLogShell" class="min-h-0 overflow-hidden rounded border border-slate-200">
                            <button type="button" onclick="toggleLogPanel()" class="w-full px-3 py-2 bg-slate-50 border-b border-slate-200 text-sm font-semibold flex items-center justify-between text-left">
                                <span>运行日志</span>
                                <span id="log-toggle-icon" class="text-xs text-slate-500">▼</span>
                            </button>
                            <div id="logContainer" class="overflow-y-auto log-box bg-white p-3 font-mono text-xs text-slate-600">
                                <div>等待任务启动...</div>
                            </div>
                        </div>
                    </section>
                </div>
            </section>
        </section>

        <section id="view-database" data-view="database" class="hidden space-y-4">
            <section class="flex h-[calc(100vh-190px)] min-h-[560px] min-w-0 flex-col overflow-hidden rounded-lg border border-slate-200 bg-white">
                <div id="database-breadcrumb" class="border-b border-slate-100 px-5 py-3 text-sm text-slate-500">数据库</div>
                <div id="databaseCollectionToolbar" class="border-b border-slate-100 px-5 pb-2 pt-2">
                    <div id="databaseSummary" class="mb-3 text-xs text-slate-500">加载中...</div>
                    <div class="flex flex-wrap gap-2">
                        <button id="autoSelectBtn" onclick="autoSelectMagnets()" title="按评分自动选择磁力" aria-label="按评分自动选择磁力" class="inline-flex h-9 items-center justify-center rounded bg-amber-50 px-3 text-xs font-bold text-amber-700 hover:bg-amber-100">★ 自动选择</button>
                        <div id="globalMagnetCheckSlot"></div>
                        <button id="batchDeleteBtn" onclick="batchDelete()" title="批量删除" aria-label="批量删除 0 个数据集合" class="hidden relative inline-flex h-9 w-9 shrink-0 items-center justify-center rounded bg-red-50 text-red-700 hover:bg-red-100 disabled:opacity-40 disabled:cursor-not-allowed">
                            <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"></path>
                                <path d="M8 6V4h8v2"></path>
                                <path d="M6 6l1 15h10l1-15"></path>
                                <path d="M10 11v6"></path>
                                <path d="M14 11v6"></path>
                            </svg>
                            <span id="batchDeleteCount" class="absolute -right-1 -top-1 min-w-4 rounded-full bg-red-600 px-1 text-center text-[10px] leading-4 text-white">0</span>
                        </button>
                        <button onclick="loadCollections()" title="刷新" aria-label="刷新数据集合" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded bg-white text-slate-700 shadow-sm ring-1 ring-slate-200 hover:bg-slate-50">
                            <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                                <path d="M21 3v6h-6"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="database-content" class="flex min-h-0 flex-1 flex-col overflow-hidden">
                    <div class="flex min-h-[520px] items-center justify-center p-8 text-center text-sm text-slate-400">加载中...</div>
                </div>
            </section>
        </section>

        <section id="view-settings" data-view="settings" class="hidden max-w-3xl mx-auto">
            <section class="bg-white border border-slate-200 rounded-lg overflow-hidden">
                <div class="w-full px-5 py-1.5 border-b border-slate-100">
                    <h2 class="text-lg font-semibold">全局运行配置</h2>
                </div>
                <div id="runtime-config-body" class="p-5 space-y-4 text-sm">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="text-slate-600">Cookie</label>
                            <a href="https://javdb.com" target="_blank" class="text-xs text-blue-600 underline">打开 JavDB</a>
                        </div>
                        <textarea id="cookie" rows="4" class="w-full border border-slate-300 rounded p-2 font-mono text-xs" oninput="saveCookieBrowserCache()"></textarea>
                        <label class="mt-2 flex items-center gap-2 text-xs text-slate-500">
                            <input id="remember_cookie" type="checkbox" class="w-4 h-4" onchange="saveRuntimeConfig()">
                            <span>记住 Cookie（写入后端数据库）</span>
                        </label>
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-600">User-Agent</label>
                        <input id="user_agent" type="text" class="w-full border border-slate-300 rounded p-2 font-mono text-xs">
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-600">HTTP 代理</label>
                        <div class="flex gap-2">
                            <input id="proxy_host" type="text" class="w-2/3 border border-slate-300 rounded p-2 font-mono text-xs" placeholder="127.0.0.1">
                            <input id="proxy_port" type="text" class="w-1/3 border border-slate-300 rounded p-2 font-mono text-xs" placeholder="7890">
                        </div>
                    </div>
                    <div>
                        <label class="block mb-1 text-slate-600">Tracker 列表</label>
                        <textarea id="tracker_list" rows="4" class="w-full border border-slate-300 rounded p-2 font-mono text-xs" placeholder="一行一个 tracker URL"></textarea>
                    </div>
                    <button type="button" onclick="saveRuntimeConfig(true)" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-2 rounded">保存全局配置</button>
                </div>
            </section>
        </section>
    </main>

    <!-- 前端脚本：以普通脚本顺序加载，保持全局作用域，确保内联 onclick 处理器可用 -->
    <script src="/js/utils.js?v=20260614-ui31"></script>
    <script src="/js/state.js?v=20260614-ui31"></script>
    <script src="/js/api.js?v=20260614-ui31"></script>
    <script src="/js/settings.js?v=20260614-ui31"></script>
    <script src="/js/tasks.js?v=20260614-ui31"></script>
    <script src="/js/movies.js?v=20260614-ui31"></script>
    <script src="/js/magnets.js?v=20260614-ui31"></script>
    <script src="/js/app.js?v=20260614-ui31"></script>
</body>
</html>

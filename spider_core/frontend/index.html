<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavDB Magnet Spider</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .log-box::-webkit-scrollbar { width: 6px; }
        .log-box::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">
    <main class="max-w-7xl mx-auto space-y-6">
        <header class="flex flex-col items-center gap-2">
            <div class="flex items-center gap-3">
                <img src="/favicon.png" alt="Logo" class="w-10 h-10 rounded-lg">
                <h1 class="text-3xl font-bold tracking-tight">JavDB Magnet Spider</h1>
            </div>
            <span id="app_version" class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2 py-1 rounded">加载中...</span>
        </header>

        <section id="authPanel" class="hidden bg-amber-50 border border-amber-200 rounded-lg p-4">
            <div class="flex flex-col md:flex-row gap-3 md:items-center">
                <div class="flex-1">
                    <div class="font-bold text-amber-800">访问令牌</div>
                    <div class="text-xs text-amber-700">启用 JAVDB_AUTH_TOKEN 后需要输入令牌才能调用 API。</div>
                </div>
                <input id="auth_token" type="password" autocomplete="off" placeholder="输入访问令牌" class="md:w-72 border border-amber-300 rounded p-2 text-sm">
                <button type="button" onclick="saveAuthToken()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded">保存</button>
            </div>
        </section>

        <section class="grid grid-cols-1 xl:grid-cols-[430px_1fr] gap-6 items-start">
            <div class="space-y-6">
                <section class="bg-white border border-slate-200 rounded-lg overflow-hidden">
                    <div class="px-5 py-4 border-b border-slate-100">
                        <h2 class="text-lg font-semibold">任务配置</h2>
                    </div>
                    <div class="p-5 space-y-4 text-sm">
                        <div>
                            <label class="block mb-1 text-slate-600">起始页面 URL</label>
                            <div class="flex gap-2">
                                <input id="start_url" type="text" class="flex-1 border border-slate-300 rounded p-2" placeholder="https://javdb.com/actors/...">
                                <button type="button" onclick="fetchTags()" class="px-3 py-2 rounded bg-indigo-50 text-indigo-700 font-bold border border-indigo-100">标签</button>
                            </div>
                            <div id="tags-wrapper" class="hidden mt-3 border border-indigo-100 rounded overflow-hidden">
                                <button type="button" onclick="toggleTagsPanel()" class="w-full bg-indigo-50 px-3 py-2 text-xs font-bold text-indigo-700 flex items-center justify-between">
                                    <span>标签过滤</span>
                                    <span id="tags-toggle-icon">▲</span>
                                </button>
                                <div id="tags-list" class="p-3 flex flex-wrap gap-2"></div>
                            </div>
                        </div>
                        <div>
                            <label class="block mb-1 text-slate-600">自定义任务/文件名</label>
                            <input id="filename" type="text" class="w-full border border-slate-300 rounded p-2" placeholder="留空则入队时自动命名">
                        </div>
                        <button id="addTaskBtn" type="button" onclick="addTask()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded">添加到任务列表</button>
                    </div>
                </section>

                <section class="bg-white border border-slate-200 rounded-lg overflow-hidden">
                    <button type="button" onclick="toggleRuntimePanel()" class="w-full px-5 py-4 border-b border-slate-100 flex items-center justify-between text-left">
                        <h2 class="text-lg font-semibold">全局运行配置</h2>
                        <span id="runtime-toggle-icon" class="text-xs font-bold text-slate-500">▼</span>
                    </button>
                    <div id="runtime-config-body" class="hidden p-5 space-y-4 text-sm">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-slate-600">Cookie</label>
                                <a href="https://javdb.com" target="_blank" class="text-xs text-blue-600 underline">打开 JavDB</a>
                            </div>
                            <textarea id="cookie" rows="4" class="w-full border border-slate-300 rounded p-2 font-mono text-xs" oninput="saveCookieBrowserCache()"></textarea>
                            <label class="mt-2 flex items-center gap-2 text-xs text-slate-500">
                                <input id="remember_cookie" type="checkbox" class="w-4 h-4" onchange="saveRuntimeConfig()">
                                <span>记住 Cookie（写入后端数据库）</span>
                            </label>
                        </div>
                        <div>
                            <label class="block mb-1 text-slate-600">User-Agent</label>
                            <input id="user_agent" type="text" class="w-full border border-slate-300 rounded p-2 font-mono text-xs">
                        </div>
                        <div>
                            <label class="block mb-1 text-slate-600">HTTP 代理</label>
                            <div class="flex gap-2">
                                <input id="proxy_host" type="text" class="w-2/3 border border-slate-300 rounded p-2 font-mono text-xs" placeholder="127.0.0.1">
                                <input id="proxy_port" type="text" class="w-1/3 border border-slate-300 rounded p-2 font-mono text-xs" placeholder="7890">
                            </div>
                        </div>
                        <div>
                            <label class="block mb-1 text-slate-600">Tracker 列表</label>
                            <textarea id="tracker_list" rows="4" class="w-full border border-slate-300 rounded p-2 font-mono text-xs" placeholder="一行一个 tracker URL"></textarea>
                        </div>
                        <button type="button" onclick="saveRuntimeConfig(true)" class="w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-2 rounded">保存全局配置</button>
                    </div>
                </section>
            </div>

            <section class="bg-white border border-slate-200 rounded-lg overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="text-lg font-semibold">任务监控</h2>
                    <button onclick="refreshMonitor()" class="text-xs px-3 py-1.5 bg-slate-50 hover:bg-slate-100 rounded font-bold">刷新</button>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-[280px_1fr] min-h-[520px]">
                    <aside class="border-r border-slate-100 bg-slate-50">
                        <div class="p-4 border-b border-slate-200 space-y-3">
                            <button id="startQueueBtn" onclick="startQueue()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded disabled:opacity-40 disabled:cursor-not-allowed">开始任务队列</button>
                            <div id="queueSummary" class="text-xs text-slate-500 text-center">加载中...</div>
                            <div class="grid grid-cols-2 gap-2">
                                <button id="toggleFinishedBtn" type="button" onclick="toggleFinishedTasks()" class="text-xs px-2 py-1.5 rounded bg-slate-100 text-slate-700 font-bold">显示已结束</button>
                                <button id="cleanupFinishedBtn" type="button" onclick="cleanupFinishedTasks()" class="text-xs px-2 py-1.5 rounded bg-red-50 text-red-700 font-bold disabled:opacity-40 disabled:cursor-not-allowed">清理已结束</button>
                            </div>
                        </div>
                        <div id="task-list" class="divide-y divide-slate-200 max-h-[620px] overflow-y-auto log-box">
                            <div class="p-4 text-center text-slate-400 text-sm">暂无任务</div>
                        </div>
                    </aside>

                    <section class="p-5 flex flex-col gap-5">
                        <div class="flex flex-col md:flex-row md:items-start justify-between gap-3">
                            <div>
                                <div class="text-xs text-slate-500 mb-1">当前任务</div>
                                <h3 id="currentTaskTitle" class="text-xl font-bold">空闲</h3>
                                <div id="currentTaskMeta" class="text-xs text-slate-500 mt-1">没有正在执行或阻塞的任务</div>
                            </div>
                            <div id="currentActions" class="flex flex-wrap gap-2"></div>
                        </div>

                        <div class="bg-slate-50 border border-slate-100 rounded p-4">
                            <div class="flex justify-between text-sm mb-2">
                                <span id="statusLabel" class="font-medium text-slate-500">状态: 空闲</span>
                                <span id="progressText" class="font-mono font-bold">0/0</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-2.5 mb-2">
                                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width:0%"></div>
                            </div>
                            <div class="text-xs text-right text-slate-500">当前目标: <span id="currentCode" class="font-mono font-bold text-slate-700">-</span></div>
                        </div>

                        <div class="border border-slate-200 rounded overflow-hidden flex-1">
                            <button type="button" onclick="toggleLogPanel()" class="w-full px-3 py-2 bg-slate-50 border-b border-slate-200 text-sm font-semibold flex items-center justify-between text-left">
                                <span>运行日志</span>
                                <span id="log-toggle-icon" class="text-xs text-slate-500">▼</span>
                            </button>
                            <div id="logContainer" class="h-80 overflow-y-auto log-box bg-white p-3 font-mono text-xs text-slate-600">
                                <div>等待任务启动...</div>
                            </div>
                        </div>
                    </section>
                </div>
            </section>
        </section>

        <section class="bg-white border border-slate-200 rounded-lg overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-lg font-semibold">数据库管理</h2>
                <div class="flex gap-2">
                    <button id="autoSelectBtn" onclick="autoSelectMagnets()" title="按评分自动选择磁力" aria-label="按评分自动选择磁力" class="text-xs px-2.5 py-1.5 rounded bg-amber-50 text-amber-700 hover:bg-amber-100 font-bold">★</button>
                    <div id="globalMagnetCheckSlot"></div>
                    <button id="batchDeleteBtn" onclick="batchDelete()" title="批量删除" aria-label="批量删除 0 个数据集合" class="hidden relative inline-flex h-9 w-9 shrink-0 items-center justify-center rounded bg-red-50 text-red-700 hover:bg-red-100 disabled:opacity-40 disabled:cursor-not-allowed">
                        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4h8v2"></path>
                            <path d="M6 6l1 15h10l1-15"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                        </svg>
                        <span id="batchDeleteCount" class="absolute -right-1 -top-1 min-w-4 rounded-full bg-red-600 px-1 text-[10px] leading-4 text-white">0</span>
                    </button>
                    <button onclick="loadCollections()" title="刷新" aria-label="刷新数据集合" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded bg-slate-50 text-slate-700 hover:bg-slate-100">
                        <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                            <path d="M21 3v6h-6"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="overflow-x-hidden">
                <table class="w-full table-fixed text-sm text-left">
                    <colgroup>
                        <col class="w-10">
                        <col>
                        <col class="w-[60px]">
                        <col class="w-[108px]">
                    </colgroup>
                    <thead class="bg-slate-50 text-xs text-slate-600 uppercase border-b border-slate-200">
                        <tr>
                            <th class="px-3 py-3 text-center"><input id="selectAllCheckbox" type="checkbox" onclick="toggleSelectAll()" class="hidden"></th>
                            <th class="px-3 py-3">数据集合</th>
                            <th class="px-1 py-3 text-center">影片数</th>
                            <th class="px-1 py-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="collection-list">
                        <tr><td colspan="4" class="px-6 py-5 text-center text-slate-400">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        let pollInterval = null;
        let apiToken = sessionStorage.getItem('javdb_auth_token') || '';
        let authRequired = false;
        let tasksCache = [];
        let queueStatus = null;
        let collectionsCache = [];
        let actorBaseUrl = '';
        let actorBaseParams = new URLSearchParams();
        let availableTags = [];
        let selectedTags = new Set();
        let tagsCollapsed = false;
        let runtimeConfigCollapsed = true;
        let logCollapsed = true;
        let showFinishedTasks = false;
        let expandedCollectionName = null;
        let expandedMovieId = null;
        let collectionMovieCache = {};
        let collectionTagFilters = {};
        let openTagDropdown = null;
        let openMagnetCheckMenu = null;
        let activeMagnetCheckJob = null;
        let magnetCheckPollInterval = null;

        function apiHeaders(extraHeaders = {}) {
            const headers = { ...extraHeaders };
            if (apiToken) headers['X-JavDB-Token'] = apiToken;
            return headers;
        }

        async function apiFetch(url, options = {}) {
            const response = await fetch(url, { ...options, headers: apiHeaders(options.headers || {}) });
            if (response.status === 401) {
                showAuthPanel(true);
                throw new Error('访问令牌缺失或无效');
            }
            return response;
        }

        function showAuthPanel(show) {
            document.getElementById('authPanel').classList.toggle('hidden', !show);
        }

        function saveAuthToken() {
            apiToken = document.getElementById('auth_token').value.trim();
            if (!apiToken) return alert('请输入访问令牌');
            sessionStorage.setItem('javdb_auth_token', apiToken);
            showAuthPanel(false);
            refreshAll();
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function escapeJs(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'");
        }

        function displayName(value) {
            return String(value || '').replace(/\.csv$/i, '');
        }

        function formatGb(sizeMb) {
            return `${(Number(sizeMb || 0) / 1024).toFixed(1)} GB`;
        }

        function filterKey(name) {
            return String(name || '');
        }

        function selectedCollectionTags(name) {
            return collectionTagFilters[filterKey(name)] || [];
        }

        function tagsQuery(name) {
            const tags = selectedCollectionTags(name);
            return tags.length ? `&tags=${encodeURIComponent(tags.join(','))}` : '';
        }

        function movieMatchesTags(movie, selectedTags) {
            if (!selectedTags.length) return true;
            const movieTags = new Set(movie.tags || []);
            return selectedTags.every(tag => movieTags.has(tag));
        }

        function filterMovies(movies, selectedTags) {
            return (movies || []).filter(movie => movieMatchesTags(movie, selectedTags));
        }

        function collectionHealthCounts(movies) {
            return (movies || []).reduce((counts, movie) => {
                if (movie.magnet_health && counts[movie.magnet_health] !== undefined) {
                    counts[movie.magnet_health] += 1;
                }
                return counts;
            }, { active: 0, weak: 0, dead: 0, failed: 0 });
        }

        function renderHealthCount(value) {
            return value ? String(value) : '-';
        }

        function renderCollectionHealthTags(movies) {
            const counts = collectionHealthCounts(movies);
            const items = [
                { key: 'active', title: '有效影片', className: 'border-emerald-200 bg-emerald-50 text-emerald-700' },
                { key: 'weak', title: '弱影片', className: 'border-amber-200 bg-amber-50 text-amber-700' },
                { key: 'dead', title: '无效影片', className: 'border-red-200 bg-red-100 text-red-700' },
                { key: 'failed', title: '检测失败影片', className: 'border-red-100 bg-red-50 text-red-400' },
            ];
            return `<div class="grid h-9 grid-cols-2 grid-rows-2 gap-0.5" aria-label="磁力检测影片统计">
                ${items.map(item => `<span title="${item.title}" class="flex min-w-[4ch] items-center justify-center rounded border px-1 text-[10px] font-bold leading-none ${item.className}">${renderHealthCount(counts[item.key])}</span>`).join('')}
            </div>`;
        }

        function renderMovieTags(tags) {
            const list = tags || [];
            if (!list.length) return '';
            return `<div class="movie-tags mt-2 flex max-w-full flex-nowrap gap-0.5 overflow-hidden" title="${escapeHtml(list.join(', '))}">
                ${list.map(tag => `<span data-role="tag" class="shrink-0 max-w-[104px] truncate px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 text-[11px]">${escapeHtml(tag)}</span>`).join('')}
                <span data-role="more" class="hidden shrink-0 px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 text-[11px]">+0</span>
            </div>`;
        }

        function fitMovieTags(root = document) {
            root.querySelectorAll('.movie-tags').forEach(container => {
                const tags = Array.from(container.querySelectorAll('[data-role="tag"]'));
                const more = container.querySelector('[data-role="more"]');
                if (!more) return;
                tags.forEach(tag => tag.classList.remove('hidden'));
                more.classList.add('hidden');
                more.innerText = '+0';
                const available = container.clientWidth;
                if (!available) return;
                let used = 0;
                let visibleCount = 0;
                const gap = 2;
                for (const tag of tags) {
                    const nextUsed = used + tag.offsetWidth + (visibleCount ? gap : 0);
                    const remaining = tags.length - visibleCount - 1;
                    more.innerText = `+${remaining}`;
                    let moreWidth = 0;
                    if (remaining > 0) {
                        more.classList.remove('hidden');
                        more.classList.add('invisible');
                        moreWidth = more.offsetWidth + gap;
                        more.classList.add('hidden');
                        more.classList.remove('invisible');
                    }
                    if (nextUsed + moreWidth > available) break;
                    used = nextUsed;
                    visibleCount += 1;
                }
                tags.forEach((tag, index) => tag.classList.toggle('hidden', index >= visibleCount));
                const hiddenCount = tags.length - visibleCount;
                if (hiddenCount > 0) {
                    more.innerText = `+${hiddenCount}`;
                    more.classList.remove('hidden');
                }
            });
        }

        function getProxyValue() {
            const host = document.getElementById('proxy_host').value.trim();
            const port = document.getElementById('proxy_port').value.trim();
            if (!host && !port) return '';
            if (!host || !port) throw new Error('代理地址和端口必须同时填写');
            return `http://${host.replace(/^https?:\/\//, '')}:${port}`;
        }

        function setProxyInputs(proxy) {
            const value = proxy || '';
            const clean = value.replace(/^https?:\/\//, '');
            const index = clean.lastIndexOf(':');
            document.getElementById('proxy_host').value = index > 0 ? clean.slice(0, index) : clean;
            document.getElementById('proxy_port').value = index > 0 ? clean.slice(index + 1) : '';
        }

        function getTrackerList() {
            return document.getElementById('tracker_list').value
                .split(/\r?\n/)
                .map(item => item.trim())
                .filter(Boolean);
        }

        function setTrackerList(trackers) {
            document.getElementById('tracker_list').value = (trackers || []).join('\n');
        }

        function renderMagnetStatus(magnet) {
            if (magnet.check_error && !magnet.check_status) {
                return `<span title="${escapeHtml(magnet.check_error)}" class="text-slate-500">❌</span>`;
            }
            if (!magnet.checked_at) return '<span title="未检测" class="text-slate-400">⚪</span>';
            if (magnet.check_status === 'active') return '<span title="有效" class="text-green-600">🟢</span>';
            if (magnet.check_status === 'weak') return '<span title="弱" class="text-yellow-500">🟡</span>';
            if (magnet.check_status === 'dead') return `<span title="${escapeHtml(magnet.check_error || '无效')}" class="text-red-600">🔴</span>`;
            return `<span title="${escapeHtml(magnet.check_error || '检测失败')}" class="text-slate-500">❌</span>`;
        }

        function renderRuntimePanelState() {
            document.getElementById('runtime-config-body').classList.toggle('hidden', runtimeConfigCollapsed);
            document.getElementById('runtime-toggle-icon').innerText = runtimeConfigCollapsed ? '▼' : '▲';
        }

        function toggleRuntimePanel() {
            runtimeConfigCollapsed = !runtimeConfigCollapsed;
            renderRuntimePanelState();
        }

        function renderLogPanelState() {
            document.getElementById('logContainer').classList.toggle('hidden', logCollapsed);
            document.getElementById('log-toggle-icon').innerText = logCollapsed ? '▼' : '▲';
        }

        function toggleLogPanel() {
            logCollapsed = !logCollapsed;
            renderLogPanelState();
        }

        function saveCookieBrowserCache() {
            const cookie = document.getElementById('cookie').value;
            if (document.getElementById('remember_cookie').checked) {
                localStorage.setItem('javdb_remember_cookie', '1');
                localStorage.setItem('javdb_cookie', cookie);
                sessionStorage.removeItem('javdb_cookie');
            } else {
                localStorage.setItem('javdb_remember_cookie', '0');
                localStorage.removeItem('javdb_cookie');
                sessionStorage.setItem('javdb_cookie', cookie);
            }
        }

        async function loadRuntimeConfig() {
            const remember = localStorage.getItem('javdb_remember_cookie') === '1';
            document.getElementById('remember_cookie').checked = remember;
            document.getElementById('cookie').value = remember ? (localStorage.getItem('javdb_cookie') || '') : (sessionStorage.getItem('javdb_cookie') || '');

            const res = await apiFetch('/api/runtime_config').then(r => r.json());
            if (res.code !== 200) return;
            const data = res.data;
            document.getElementById('remember_cookie').checked = !!data.remember_cookie;
            document.getElementById('user_agent').value = data.user_agent || localStorage.getItem('javdb_ua') || defaultUA();
            setProxyInputs(data.proxies || localStorage.getItem('javdb_proxy') || '');
            setTrackerList(data.trackers || []);
        }

        async function saveRuntimeConfig(showMessage = false) {
            let proxy = '';
            try {
                proxy = getProxyValue();
            } catch (err) {
                return alert(err.message);
            }
            const payload = {
                cookie: document.getElementById('cookie').value.trim(),
                remember_cookie: document.getElementById('remember_cookie').checked,
                user_agent: document.getElementById('user_agent').value.trim(),
                proxies: proxy,
                trackers: getTrackerList()
            };
            saveCookieBrowserCache();
            localStorage.setItem('javdb_ua', payload.user_agent);
            localStorage.setItem('javdb_proxy', proxy);
            const res = await apiFetch('/api/runtime_config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => r.json());
            if (showMessage) alert(res.msg || '已保存');
        }

        function defaultUA() {
            return 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36 Edg/120.0.0.0';
        }

        function prepareActorUrl(rawUrl) {
            const parsed = new URL(rawUrl);
            actorBaseUrl = `${parsed.origin}${parsed.pathname}`;
            actorBaseParams = new URLSearchParams(parsed.search);
            actorBaseParams.set('locale', 'zh');
            if (!actorBaseParams.has('sort_type')) actorBaseParams.set('sort_type', '0');
            actorBaseParams.delete('page');
            actorBaseParams.delete('t');
            return buildActorUrl();
        }

        function buildActorUrl(tagValues = null) {
            const params = new URLSearchParams(actorBaseParams);
            params.set('locale', 'zh');
            if (tagValues) params.set('t', tagValues);
            else params.delete('t');
            return `${actorBaseUrl}?${params.toString()}`;
        }

        async function fetchTags() {
            const urlInput = document.getElementById('start_url');
            if (!urlInput.value.trim()) return alert('请先输入起始页面 URL');
            await saveRuntimeConfig(false);
            const normalizedUrl = prepareActorUrl(urlInput.value.trim());
            urlInput.value = normalizedUrl;
            selectedTags.clear();
            const res = await apiFetch('/api/get_tags', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: normalizedUrl })
            }).then(r => r.json());
            if (res.code !== 200) return alert(res.msg || '获取标签失败');
            availableTags = res.data || [];
            tagsCollapsed = false;
            renderTags();
            document.getElementById('tags-wrapper').classList.toggle('hidden', availableTags.length === 0);
            renderTagsPanelState();
        }

        function renderTags() {
            const box = document.getElementById('tags-list');
            box.innerHTML = availableTags.map(tag => {
                const selected = selectedTags.has(tag.value);
                return `<button type="button" onclick="toggleTag('${escapeJs(tag.value)}')" class="px-3 py-1.5 rounded text-xs border ${selected ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-300'}">${escapeHtml(tag.name)}</button>`;
            }).join('');
        }

        function renderTagsPanelState() {
            document.getElementById('tags-list').classList.toggle('hidden', tagsCollapsed);
            document.getElementById('tags-toggle-icon').innerText = tagsCollapsed ? '▼' : '▲';
        }

        function toggleTagsPanel() {
            tagsCollapsed = !tagsCollapsed;
            renderTagsPanelState();
        }

        function toggleTag(value) {
            if (selectedTags.has(value)) selectedTags.delete(value);
            else selectedTags.add(value);
            document.getElementById('start_url').value = selectedTags.size ? buildActorUrl(Array.from(selectedTags).join(',')) : buildActorUrl();
            renderTags();
        }

        async function addTask(crawlMode = '') {
            const url = document.getElementById('start_url').value.trim();
            if (!url) return alert('URL 不能为空');
            await saveRuntimeConfig(false);
            let proxy = '';
            try {
                proxy = getProxyValue();
            } catch (err) {
                return alert(err.message);
            }
            const payload = {
                start_url: url,
                filename: document.getElementById('filename').value.trim(),
                crawl_mode: crawlMode,
                cookie: document.getElementById('cookie').value.trim(),
                remember_cookie: document.getElementById('remember_cookie').checked,
                user_agent: document.getElementById('user_agent').value.trim(),
                proxies: proxy
            };
            const response = await apiFetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const res = await response.json();
            if (response.status === 409 && res.needs_mode) {
                const useIncremental = confirm(`检测到已有数据库集合：${displayName(res.filename)}\n点击“确定”使用增量，点击“取消”使用覆盖。`);
                return addTask(useIncremental ? 'incremental' : 'overwrite');
            }
            if (res.code !== 200) return alert(res.msg || '添加任务失败');
            document.getElementById('filename').value = '';
            await refreshMonitor();
        }

        async function startQueue() {
            const res = await apiFetch('/api/tasks/start_queue', { method: 'POST' }).then(r => r.json());
            if (res.code !== 200) return alert(res.msg || '无法启动队列');
            if (!pollInterval) pollInterval = setInterval(refreshMonitor, 2000);
            await refreshMonitor();
        }

        function stateLabel(state) {
            return {
                pending: '排队中',
                running: '运行中',
                pause_requested: '暂停中',
                paused: '已暂停',
                waiting_cookie: '等待 Cookie',
                waiting_choice: '等待模式',
                cancel_requested: '取消中',
                canceled: '已取消',
                finished: '已完成',
                failed: '失败'
            }[state] || state || '-';
        }

        function stateClass(state) {
            if (state === 'running') return 'bg-blue-50 text-blue-700';
            if (state === 'pending') return 'bg-slate-100 text-slate-700';
            if (state === 'finished') return 'bg-green-50 text-green-700';
            if (state === 'waiting_cookie') return 'bg-orange-50 text-orange-700';
            if (state === 'waiting_choice') return 'bg-purple-50 text-purple-700';
            if (state === 'paused' || state === 'pause_requested') return 'bg-amber-50 text-amber-700';
            if (state === 'failed' || state === 'canceled' || state === 'cancel_requested') return 'bg-red-50 text-red-700';
            return 'bg-slate-100 text-slate-700';
        }

        function isFinishedTask(task) {
            return ['finished', 'canceled', 'failed'].includes(task.state);
        }

        async function loadTasks() {
            const [tasksRes, queueRes] = await Promise.all([
                apiFetch('/api/tasks').then(r => r.json()),
                apiFetch('/api/tasks/queue_status').then(r => r.json())
            ]);
            tasksCache = tasksRes.data || [];
            queueStatus = queueRes.data || {};
            renderTaskList();
            renderQueueControls();
        }

        function renderQueueControls() {
            const btn = document.getElementById('startQueueBtn');
            btn.disabled = !queueStatus.can_start;
            btn.innerText = queueStatus.queue_state === 'running' ? '队列运行中' : '开始任务队列';
            const activeCount = queueStatus.active_count || 0;
            const finishedCount = queueStatus.finished_count || 0;
            document.getElementById('queueSummary').innerText = `待处理 ${activeCount} 个 · 已结束 ${finishedCount} 个 · ${queueStatus.queue_state || 'idle'}`;
            document.getElementById('toggleFinishedBtn').innerText = showFinishedTasks ? '隐藏已结束' : '显示已结束';
            document.getElementById('cleanupFinishedBtn').disabled = finishedCount <= 0;
        }

        function taskActions(task) {
            const id = escapeJs(task.task_id);
            const actions = [];
            if (['running', 'pending', 'pause_requested'].includes(task.state)) actions.push(`<button onclick="pauseTask('${id}')" class="text-xs px-2 py-1 rounded bg-amber-50 text-amber-700 font-bold">暂停</button>`);
            if (['paused', 'waiting_cookie', 'waiting_choice'].includes(task.state)) actions.push(`<button onclick="resumeTaskById('${id}')" class="text-xs px-2 py-1 rounded bg-blue-50 text-blue-700 font-bold">恢复</button>`);
            if (task.state === 'waiting_cookie') actions.push(`<button onclick="refreshCookie('${id}')" class="text-xs px-2 py-1 rounded bg-orange-50 text-orange-700 font-bold">读安卓 Cookie</button>`);
            if (task.state === 'waiting_choice') {
                actions.push(`<button onclick="setTaskModeById('${id}', 'incremental')" class="text-xs px-2 py-1 rounded bg-purple-50 text-purple-700 font-bold">增量</button>`);
                actions.push(`<button onclick="setTaskModeById('${id}', 'overwrite')" class="text-xs px-2 py-1 rounded bg-red-50 text-red-700 font-bold">覆盖</button>`);
            }
            if (['pending', 'running', 'pause_requested', 'paused', 'waiting_cookie', 'waiting_choice'].includes(task.state)) actions.push(`<button onclick="cancelTask('${id}')" class="text-xs px-2 py-1 rounded bg-red-50 text-red-700 font-bold">取消</button>`);
            return actions.join(' ');
        }

        function renderTaskList() {
            const box = document.getElementById('task-list');
            const visibleTasks = showFinishedTasks ? tasksCache : tasksCache.filter(task => !isFinishedTask(task));
            if (!visibleTasks.length) {
                box.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">暂无任务</div>';

            box.innerHTML = visibleTasks.map(task => {

                    : '';
                return `
                <div class="grid grid-cols-[minmax(0,1fr)_52px_42px_72px_52px] items-center gap-1 px-3 py-2 text-xs ${task.task_id === queueStatus.current_task_id ? 'bg-blue-50' : 'bg-white'}">

                    <div class="text-right">

            showFinishedTasks = !showFinishedTasks;

        async function cleanupFinishedTasks() {
            const finishedCount = queueStatus?.finished_count || 0;
            if (finishedCount <= 0) return;
            if (!confirm(`确定清理 ${finishedCount} 个已结束任务吗？\n不会删除数据库集合或已爬取数据。`)) return;
            const res = await apiFetch('/api/tasks/cleanup', { method: 'POST' }).then(r => r.json());
            if (res.code !== 200) return alert(res.msg || '清理失败');
            alert(res.msg || '已清理已结束任务');
            await refreshMonitor();
        }

        function currentTask() {
            return tasksCache.find(t => t.task_id === queueStatus.current_task_id)
                || tasksCache.find(t => ['running', 'pause_requested', 'cancel_requested', 'waiting_cookie', 'waiting_choice', 'paused'].includes(t.state))
                || null;
        }

        async function pollStatus() {
            const data = await apiFetch('/api/status').then(r => r.json());
            renderCurrentTask(data);
        }

        function renderCurrentTask(data) {
            const task = currentTask();
            const title = task ? displayName(task.final_filename || task.filename || '当前任务') : '空闲';
            document.getElementById('currentTaskTitle').innerText = title;
            document.getElementById('currentTaskMeta').innerText = task ? `${stateLabel(task.state)} · ${task.start_url || ''}` : '没有正在执行或阻塞的任务';
            document.getElementById('statusLabel').innerText = `状态: ${stateLabel(data.state)}`;
            document.getElementById('progressText').innerText = data.progress || '0/0';
            document.getElementById('currentCode').innerText = data.current || '-';
            const parts = String(data.progress || '0/0').split('/');
            const pct = Number(parts[1]) ? Math.min(100, Math.round(Number(parts[0]) / Number(parts[1]) * 100)) : 0;
            document.getElementById('progressBar').style.width = `${pct}%`;
            const logs = data.logs || [];
            document.getElementById('logContainer').innerHTML = logs.length
                ? logs.map(log => `<div class="mb-1 border-b border-slate-100 pb-1">${escapeHtml(log)}</div>`).join('')
                : '<div>等待任务启动...</div>';
            renderCurrentActions(task);
        }

        function renderCurrentActions(task) {
            const box = document.getElementById('currentActions');
            if (!task) {
                box.innerHTML = '';
                return;
            }
            box.innerHTML = taskActions(task);
        }

            await loadTasks();
            await pollStatus();

            const res = await apiFetch(`/api/tasks/${encodeURIComponent(taskId)}`, { method: 'DELETE' }).then(r => r.json());

        async function toggleCollection(name) {
            const row = document.getElementById(`collection-${name}`);
            const body = document.getElementById(`collection-body-${name}`);
            if (!row || !body) return;

            const shouldOpen = row.classList.contains('hidden');
            if (expandedCollectionName && expandedCollectionName !== name) {
                const previousRow = document.getElementById(`collection-${expandedCollectionName}`);
                if (previousRow) previousRow.classList.add('hidden');
                const previousIcon = document.getElementById(`collection-toggle-${expandedCollectionName}`);
                if (previousIcon) previousIcon.classList.remove('rotate-180');
            }
            if (!shouldOpen) {
                row.classList.add('hidden');
                const icon = document.getElementById(`collection-toggle-${name}`);
                if (icon) icon.classList.remove('rotate-180');
                expandedCollectionName = null;
                expandedMovieId = null;
                openTagDropdown = null;
                openMagnetCheckMenu = null;
                return;
            }

            row.classList.remove('hidden');
            const icon = document.getElementById(`collection-toggle-${name}`);
            if (icon) icon.classList.add('rotate-180');
            expandedCollectionName = name;
            expandedMovieId = null;
            openTagDropdown = null;
            openMagnetCheckMenu = null;
            row.querySelectorAll('[id^="magnets-"]').forEach(item => item.classList.add('hidden'));
            if (body.dataset.loaded) return;
            const res = await apiFetch(`/api/collections/${encodeURIComponent(name)}/movies`).then(r => r.json());

                return;

            collectionMovieCache[filterKey(name)] = res.data || { movies: [], available_tags: [], total_count: 0 };
            renderCollectionBody(name);

            const targetArg = scope === 'collection' || scope === 'all' ? `'${escapeJs(target)}'` : target;
            const startFn = scope === 'collection'

                : (scope === 'all' ? 'startAllMagnetCheck' : 'startMovieMagnetCheck');

                ? 'toggleCollectionMagnetCheckMenu'

            const primaryIdleClass = scope === 'movie'
                ? 'h-5 w-6 rounded-l bg-emerald-50 text-[11px] font-bold leading-none text-emerald-700 hover:bg-emerald-100'
                : 'h-9 w-14 rounded-l border border-r-0 border-emerald-200 bg-emerald-50 text-xs font-bold text-emerald-700 shadow-sm hover:bg-emerald-100';
            const primaryRunningClass = scope === 'movie'
                ? 'h-5 w-16 cursor-not-allowed rounded-l bg-slate-100 text-[10px] font-bold leading-none text-slate-500'
                : 'h-9 w-16 cursor-not-allowed rounded-l border border-r-0 border-slate-200 bg-slate-100 text-xs font-bold text-slate-500 shadow-sm';
            const toggleIdleClass = scope === 'movie'
                ? 'h-5 w-5 rounded-r border-l border-emerald-100 bg-emerald-50 text-[10px] font-bold leading-none text-emerald-700 hover:bg-emerald-100'
                : 'h-9 w-7 rounded-r border border-emerald-200 bg-emerald-50 text-xs font-bold text-emerald-700 shadow-sm hover:bg-emerald-100';
            const toggleRunningClass = scope === 'movie'
                ? 'h-5 w-5 cursor-not-allowed rounded-r border-l border-slate-200 bg-slate-100 text-[10px] font-bold leading-none text-slate-400'
                : 'h-9 w-7 cursor-not-allowed rounded-r border border-slate-200 bg-slate-100 text-xs font-bold text-slate-400 shadow-sm';
            const primaryClass = isRunning
                ? primaryRunningClass
                : primaryIdleClass;
            const toggleClass = isRunning ? toggleRunningClass : toggleIdleClass;
            const spinnerClass = scope === 'movie' ? 'h-2.5 w-2.5' : 'h-3 w-3';
            const primaryContent = scope === 'movie' && !isRunning ? radarIcon : `<span>${progress}</span>`;
            return `
                <div id="${magnetCheckButtonId(scope, target)}" class="relative shrink-0" data-menu-root="magnet-check">
                    <div class="inline-flex">
                        <button${idAttr} type="button" onclick="${startFn}(${targetArg})" title="检测磁力" aria-label="检测磁力"${disabledAttr} class="${primaryClass}">
                            <span class="inline-flex items-center justify-center gap-1">
                                ${isRunning ? `<span class="inline-block ${spinnerClass} animate-spin rounded-full border-2 border-slate-300 border-t-slate-600"></span>` : ''}
                                ${primaryContent}
                            </span>
                        </button>
                        <button type="button" onclick="${toggleFn}(${targetArg}, event)" title="更多检测选项" aria-label="更多检测选项"${disabledAttr} class="${toggleClass}">${isOpen ? '▲' : '▼'}</button>
                    </div>
                    <div onclick="event.stopPropagation()" class="${isOpen && !isRunning ? '' : 'hidden'} absolute right-0 z-30 mt-1 w-28 rounded border border-slate-200 bg-white p-1 text-xs shadow-lg">
                        <button type="button" onclick="${startFn}(${targetArg}, true)" class="w-full rounded px-2 py-1.5 text-left font-bold text-slate-700 hover:bg-slate-50">check failed</button>
                    </div>
                </div>`;
        }

        function updateRenderedMagnetCheckButtons() {
            renderGlobalMagnetCheckButton();
            if (!expandedCollectionName) return;
            const collectionButton = document.getElementById(magnetCheckButtonId('collection', expandedCollectionName));
            if (collectionButton) collectionButton.outerHTML = renderMagnetCheckButton('collection', expandedCollectionName);
            const movieButtonTarget = activeMagnetCheckJob && activeMagnetCheckJob.scope === 'movie'
                ? activeMagnetCheckJob.target
                : expandedMovieId;
            if (movieButtonTarget) {
                const movieButton = document.getElementById(magnetCheckButtonId('movie', movieButtonTarget));
                if (movieButton) movieButton.outerHTML = renderMagnetCheckButton('movie', movieButtonTarget);
            }
        }

        function renderGlobalMagnetCheckButton() {
            const slot = document.getElementById('globalMagnetCheckSlot');
            if (!slot) return;
            slot.innerHTML = renderMagnetCheckButton('all', 'all');
        }

        function renderMagnetCheckProgress(collectionName) {
            const job = activeMagnetCheckJob;
            if (!job || job.scope !== 'collection' || job.target !== collectionName) return '';
            const total = Number(job.total || 0);
            const completed = Number(job.completed || 0);
            const percent = total ? Math.round(completed * 100 / total) : 0;
            return `
                <div class="mb-3 rounded border border-emerald-100 bg-emerald-50 p-3 text-xs text-slate-700">
                    <div class="mb-2 flex items-center justify-between gap-3">
                        <div class="font-bold">批量检测磁力: ${completed}/${total} (${percent}%)</div>
                        ${job.running ? `<button type="button" onclick="cancelMagnetCheck('${escapeJs(job.job_id)}')" class="rounded bg-white px-2 py-1 font-bold text-red-700 hover:bg-red-50">取消检测</button>` : `<span class="font-bold text-emerald-700">${escapeHtml(job.message || '检测完成')}</span>`}
                    </div>
                    <div class="mb-2 h-2 rounded-full bg-white"><div class="h-2 rounded-full bg-emerald-600 transition-all" style="width:${percent}%"></div></div>
                    <div class="flex flex-wrap gap-3">
                        <span>🟢 有效: ${job.active || 0}</span>
                        <span>🟡 弱: ${job.weak || 0}</span>
                        <span>🔴 无效: ${job.dead || 0}</span>
                        <span>❌ 失败: ${job.failed || 0}</span>
                    </div>
                </div>`;
        }

        function renderTagOption(collectionName, value, label, checked) {
            return `<label class="flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-50 text-xs cursor-pointer">
                <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleCollectionTag('${escapeJs(collectionName)}', '${escapeJs(value)}')">
                <span class="truncate" title="${escapeHtml(label)}">${escapeHtml(label)}</span>
            </label>`;
        }

        function renderMovies(collectionName, movies) {
            if (!movies.length) return '<div class="text-center text-slate-400">暂无匹配影片记录</div>';
            return `<div class="max-h-[60vh] max-w-full space-y-2 overflow-y-auto overflow-x-hidden pr-2">${movies.map(movie => `
                <div class="max-w-full overflow-hidden bg-white border border-slate-200 rounded p-3">
                    <div class="min-w-0 overflow-hidden">
                        <div class="truncate font-bold" title="${escapeHtml(`${movie.code} ${movie.title || ''}`)}"><span>${escapeHtml(movie.code)}</span> <span class="font-normal text-slate-500">${escapeHtml(movie.title)}</span></div>
                        <div class="mt-1 grid grid-cols-[max-content_minmax(0,1fr)] items-center gap-2">
                            <div class="flex min-w-max items-center gap-1">
                                <button onclick="toggleMagnets(${movie.id})" title="展开/收起候选磁力" aria-label="展开或收起候选磁力" class="inline-flex h-6 w-6 items-center justify-center rounded bg-slate-50 text-xs font-bold text-slate-600 hover:bg-slate-100">
                                    <span id="movie-toggle-${movie.id}" class="inline-block transition-transform duration-200 ease-out">▾</span>
                                </button>
                                <div class="whitespace-nowrap rounded bg-indigo-50 px-2 py-1 text-xs font-bold leading-none text-indigo-700">候选 ${movie.candidate_count || 0}</div>
                                ${renderMagnetCheckButton('movie', movie.id)}
                            </div>
                            <div id="movie-selected-name-${movie.id}" class="min-w-0 truncate text-xs text-slate-500" title="${escapeHtml(movie.best_magnet_name || '未选中磁力')}">${escapeHtml(movie.best_magnet_name || '未选中磁力')}</div>
                        </div>
                        ${renderMovieTags(movie.tags || [])}
                    </div>
                    <div id="magnets-${movie.id}" class="hidden mt-3"></div>
                </div>
            `).join('')}</div>`;
        }

        function toggleCollectionTagDropdown(collectionName, event = null) {
            if (event) event.stopPropagation();
            openTagDropdown = openTagDropdown === collectionName ? null : collectionName;
            openMagnetCheckMenu = null;
            renderCollectionBody(collectionName);
        }

        function toggleCollectionMagnetCheckMenu(collectionName, event = null) {
            if (event) event.stopPropagation();
            const key = magnetCheckMenuKey('collection', collectionName);
            openMagnetCheckMenu = openMagnetCheckMenu === key ? null : key;
            openTagDropdown = null;
            renderCollectionBody(collectionName);
        }

        function toggleAllMagnetCheckMenu(_target = 'all', event = null) {
            if (event) event.stopPropagation();
            const key = magnetCheckMenuKey('all', 'all');
            openMagnetCheckMenu = openMagnetCheckMenu === key ? null : key;
            openTagDropdown = null;
            renderGlobalMagnetCheckButton();
        }

        async function toggleMovieMagnetCheckMenu(movieId, event = null) {
            if (event) event.stopPropagation();
            const key = magnetCheckMenuKey('movie', movieId);
            openMagnetCheckMenu = openMagnetCheckMenu === key ? null : key;
            if (!expandedCollectionName) return;
            const openedMovieId = expandedMovieId;
            renderCollectionBody(expandedCollectionName);
            if (openedMovieId) {
                expandedMovieId = openedMovieId;
                await loadMagnets(openedMovieId, true);
            }
        }

        function toggleCollectionTag(collectionName, value) {
            const key = filterKey(collectionName);
            if (value === 'all') {
                collectionTagFilters[key] = [];
            } else {
                const current = new Set(selectedCollectionTags(collectionName));
                if (current.has(value)) current.delete(value);
                else current.add(value);
                collectionTagFilters[key] = Array.from(current);
            }
            expandedMovieId = null;
            renderCollectionBody(collectionName);
        }

        function closeOpenMenus() {
            if (!openTagDropdown && !openMagnetCheckMenu) return;
            const collectionName = expandedCollectionName;
            openTagDropdown = null;
            openMagnetCheckMenu = null;
            if (collectionName) renderCollectionBody(collectionName);
        }

        function handleDocumentClick(event) {
            if (!openTagDropdown && !openMagnetCheckMenu) return;
            const target = event.target;
            if (target.closest('[data-menu-root="tag-filter"]') || target.closest('[data-menu-root="magnet-check"]')) return;
            closeOpenMenus();
        }

        async function loadMagnets(movieId, keepOpen = false) {
            const box = document.getElementById(`magnets-${movieId}`);
            if (!box) return [];
            if (keepOpen) box.classList.remove('hidden');
            const res = await apiFetch(`/api/movies/${movieId}/magnets`).then(r => r.json());
            const magnets = res.data || [];
            box.innerHTML = magnets.length ? renderMagnetTable(movieId, magnets) : '<div class="text-slate-400">暂无候选磁力</div>';
            return magnets;
            box.innerHTML = magnets.length ? `
                <div class="max-h-[280px] overflow-auto">
                    <table class="w-full table-fixed text-xs">
                        <colgroup>
                            <col class="w-11">
                            <col>
                            <col class="w-10">
                            <col class="w-16">
                            <col class="w-10">
                        </colgroup>
                        <thead class="sticky top-0 bg-slate-50"><tr><th class="p-2 text-center whitespace-nowrap">状态</th><th class="p-2 text-left">文件名</th><th class="p-2 text-center">分数</th><th class="p-2 text-center">大小</th><th class="p-2 text-center">操作</th></tr></thead>
                        <tbody>${magnets.map(magnet => `
                            <tr class="border-t border-slate-100">
                                <td class="p-2 text-center align-middle">
                                    ${magnet.is_selected
                                        ? '<span title="当前选中" aria-label="当前选中" class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-green-600 text-[11px] font-bold text-white shadow-sm ring-1 ring-green-100">✓</span>'
                                        : `<button onclick="selectMagnet(${movieId}, ${magnet.id})" title="设为选中" aria-label="设为选中" class="inline-flex h-5 w-5 items-center justify-center rounded-full border-2 border-slate-300 bg-white hover:border-green-500 hover:bg-green-50"></button>`}
                                </td>
                                <td class="min-w-0 p-2" title="${escapeHtml(magnet.link)}">
                                    <div class="truncate">${escapeHtml(magnet.name)}</div>
                                    <div class="mt-1 inline-flex max-w-full rounded bg-slate-100 px-1.5 py-0.5 text-[10px] leading-none text-slate-500">${escapeHtml(magnet.magnet_date || '-')}</div>
                                </td>
                                <td class="p-2 text-center align-middle">${magnet.priority_score}</td>
                                <td class="p-2 text-center align-middle whitespace-nowrap">${formatGb(magnet.size_mb)}</td>
                                <td class="p-2 text-center align-middle">
                                    <button onclick="copyText('${escapeJs(magnet.link)}')" title="复制磁力链接" aria-label="复制磁力链接" class="inline-flex h-7 w-7 items-center justify-center rounded bg-blue-50 text-blue-700 hover:bg-blue-100">
                                        <span class="text-sm leading-none">⧉</span>
                                    </button>
                                </td>
                            </tr>
                        `).join('')}</tbody>
                    </table>
                </div>` : '<div class="text-slate-400">暂无候选磁力</div>';
            return magnets;
        }

        function renderMagnetTable(movieId, magnets) {
            return `
                <div class="mb-2 flex items-center justify-between gap-2">
                </div>
                <div class="max-h-[280px] overflow-auto">
                    <table class="w-full table-fixed text-xs">
                        <colgroup>
                            <col class="w-14"><col><col class="w-10"><col class="w-16"><col class="w-16">
                        </colgroup>
                        <thead class="sticky top-0 bg-slate-50"><tr><th class="p-2 text-center whitespace-nowrap">状态</th><th class="p-2 text-left">文件名</th><th class="p-2 text-center">分数</th><th class="p-2 text-center">大小</th><th class="p-2 text-center">操作</th></tr></thead>
                        <tbody>${magnets.map(magnet => renderMagnetRow(movieId, magnet)).join('')}</tbody>
                    </table>
                </div>`;
        }

        function magnetRowSignature(magnet) {
            return [
                magnet.id,
                magnet.is_selected ? 1 : 0,
                magnet.priority_score,
                magnet.check_status || '',
                magnet.seeders ?? 0,
                magnet.leechers ?? 0,
                magnet.checked_at || '',
                magnet.check_error || ''
            ].join('|');
        }

        function renderMagnetRow(movieId, magnet) {
            const signature = escapeHtml(magnetRowSignature(magnet));
            return `
                <tr id="magnet-row-${magnet.id}" data-signature="${signature}" class="border-t border-slate-100">
                    <td class="p-2 text-center align-middle">
                        <div>${renderMagnetStatus(magnet)}</div>
                        <div class="mt-1 text-[10px] leading-none text-slate-400">${magnet.checked_at ? `${magnet.seeders ?? 0}/${magnet.leechers ?? 0}` : '-/-'}</div>
                    </td>
                    <td class="min-w-0 cursor-pointer p-2 hover:bg-slate-50" title="${escapeHtml(magnet.link)}" onclick="${magnet.is_selected ? '' : `selectMagnet(${movieId}, ${magnet.id})`}">
                        <div class="truncate">${magnet.is_selected ? '<span class="mr-1 text-green-600">✓</span>' : ''}${escapeHtml(magnet.name)}</div>
                        <div class="mt-1 inline-flex max-w-full rounded bg-slate-100 px-1.5 py-0.5 text-[10px] leading-none text-slate-500">${escapeHtml(magnet.magnet_date || '-')}</div>
                    </td>
                    <td class="p-2 text-center align-middle">${magnet.priority_score}</td>
                    <td class="p-2 text-center align-middle whitespace-nowrap">${formatGb(magnet.size_mb)}</td>
                    <td class="p-2 text-center align-middle">
                        <div class="flex justify-center gap-1">
                            <button onclick="copyText('${escapeJs(magnet.link)}')" title="复制磁力链接" aria-label="复制磁力链接" class="inline-flex h-7 w-7 items-center justify-center rounded bg-blue-50 text-blue-700 hover:bg-blue-100">
                                <span class="text-sm leading-none">⧉</span>
                            </button>
                        </div>
                    </td>
                </tr>`;
        }

        async function refreshMagnetRows(movieId) {
            const box = document.getElementById(`magnets-${movieId}`);
            if (!box || box.classList.contains('hidden')) return [];
            const res = await apiFetch(`/api/movies/${movieId}/magnets`).then(r => r.json());
            const magnets = res.data || [];
            if (!box.querySelector('tbody')) {
                box.innerHTML = magnets.length ? renderMagnetTable(movieId, magnets) : '<div class="text-slate-400">暂无候选磁力</div>';
                return magnets;
            }
            for (const magnet of magnets) {
                const row = document.getElementById(`magnet-row-${magnet.id}`);
                const signature = magnetRowSignature(magnet);
                if (!row) {
                    await loadMagnets(movieId, true);
                    return magnets;
                }
                if (row.dataset.signature !== signature) {
                    row.outerHTML = renderMagnetRow(movieId, magnet);
                }
            }
            return magnets;
        }

        function syncSelectedMagnetToMovie(movieId, magnets) {
            if (!expandedCollectionName) return false;
            const data = collectionMovieCache[filterKey(expandedCollectionName)];
            const selected = (magnets || []).find(magnet => magnet.is_selected);
            if (!data || !selected) return false;
            const movie = (data.movies || []).find(item => Number(item.id) === Number(movieId));
            if (!movie) return false;
            movie.best_magnet_name = selected.name || '';
            movie.best_magnet_link = selected.link || '';
            movie.priority_score = selected.priority_score || 0;
            movie.magnet_date = selected.magnet_date || '';
            movie.size_mb = selected.size_mb || 0;
            return true;
        }

        function updateMovieSelectedName(movieId, magnets) {
            const selected = (magnets || []).find(magnet => magnet.is_selected);
            const target = document.getElementById(`movie-selected-name-${movieId}`);
            if (!selected || !target) return;
            const name = selected.name || '未选中磁力';
            target.innerText = name;
            target.title = name;
        }

        async function toggleMagnets(movieId) {
            const box = document.getElementById(`magnets-${movieId}`);
            if (!box) return;
            const shouldOpen = box.classList.contains('hidden');
            if (expandedMovieId && expandedMovieId !== movieId) {
                const previousBox = document.getElementById(`magnets-${expandedMovieId}`);
                if (previousBox) previousBox.classList.add('hidden');
                const previousIcon = document.getElementById(`movie-toggle-${expandedMovieId}`);
                if (previousIcon) previousIcon.classList.remove('rotate-180');
            }
            if (!shouldOpen) {
                box.classList.add('hidden');
                const icon = document.getElementById(`movie-toggle-${movieId}`);
                if (icon) icon.classList.remove('rotate-180');
                expandedMovieId = null;
                openMagnetCheckMenu = null;
                return;
            }
            expandedMovieId = movieId;
            const icon = document.getElementById(`movie-toggle-${movieId}`);
            if (icon) icon.classList.add('rotate-180');
            await loadMagnets(movieId, true);
        }

        async function selectMagnet(movieId, magnetId) {
            const res = await apiFetch(`/api/movies/${movieId}/select_magnet`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ magnet_id: magnetId })
            }).then(r => r.json());
            if (res.code !== 200) return alert(res.msg || '更新失败');
            const magnets = await loadMagnets(movieId, true);
            if (syncSelectedMagnetToMovie(movieId, magnets)) {
                updateMovieSelectedName(movieId, magnets);
            }
        }

        async function startMovieMagnetCheck(movieId, failedOnly = false) {
            openMagnetCheckMenu = null;
            const suffix = failedOnly ? '?failed_only=1' : '';
            const res = await apiFetch(`/api/movies/${movieId}/check_magnets${suffix}`, { method: 'POST' }).then(r => r.json());
            if (res.code !== 200 && res.code !== 409) {
                return alert(res.msg || '检测启动失败');
            }
            watchMagnetCheckJob(res.data);
            if (expandedCollectionName) {
                updateRenderedMagnetCheckButtons();
                if (expandedMovieId === movieId) await refreshMagnetRows(movieId);
            }
        }

        async function startCollectionMagnetCheck(collectionName, failedOnly = false) {
            openMagnetCheckMenu = null;
            renderCollectionBody(collectionName);
            const suffix = failedOnly ? '?failed_only=1' : '';
            const res = await apiFetch(`/api/collections/${encodeURIComponent(collectionName)}/check_magnets${suffix}`, { method: 'POST' }).then(r => r.json());
            if (res.code !== 200 && res.code !== 409) return alert(res.msg || '检测启动失败');
            watchMagnetCheckJob(res.data);
            renderCollectionBody(collectionName);
        }

        async function startAllMagnetCheck(_target = 'all', failedOnly = false) {
            openMagnetCheckMenu = null;
            renderGlobalMagnetCheckButton();
            const suffix = failedOnly ? '?failed_only=1' : '';
            const res = await apiFetch(`/api/magnets/check_all${suffix}`, { method: 'POST' }).then(r => r.json());
            if (res.code !== 200 && res.code !== 409) return alert(res.msg || '检测启动失败');
            watchMagnetCheckJob(res.data);
            updateRenderedMagnetCheckButtons();
        }

        function watchMagnetCheckJob(job) {
            activeMagnetCheckJob = job;
            if (magnetCheckPollInterval) clearInterval(magnetCheckPollInterval);
            magnetCheckPollInterval = setInterval(pollMagnetCheckJob, 1000);
            pollMagnetCheckJob();
        }

        async function restoreMagnetCheckJob() {
            const res = await apiFetch('/api/magnet_check_jobs/current').then(r => r.json());
            if (res.code !== 200 || !res.data) return;
            activeMagnetCheckJob = res.data;
            if (activeMagnetCheckJob.scope === 'collection') {
                await ensureCollectionVisible(activeMagnetCheckJob.target);
            }
            watchMagnetCheckJob(activeMagnetCheckJob);
        }

        async function ensureCollectionVisible(collectionName) {
            if (!collectionName) return;
            if (expandedCollectionName !== collectionName) {
                await toggleCollection(collectionName);
                return;
            }
            const body = document.getElementById(`collection-body-${collectionName}`);
            if (body && !body.dataset.loaded) {
                const res = await apiFetch(`/api/collections/${encodeURIComponent(collectionName)}/movies`).then(r => r.json());
                if (res.code === 200) {
                    body.dataset.loaded = '1';
                    collectionMovieCache[filterKey(collectionName)] = res.data || { movies: [], available_tags: [], total_count: 0 };
                }
            }
            renderCollectionBody(collectionName);
        }

        async function pollMagnetCheckJob() {
            if (!activeMagnetCheckJob) return;
            const res = await apiFetch(`/api/magnet_check_jobs/${encodeURIComponent(activeMagnetCheckJob.job_id)}`).then(r => r.json());
            if (res.code !== 200) return;
            activeMagnetCheckJob = res.data;
            const runningJob = activeMagnetCheckJob.running;
            if (runningJob && expandedCollectionName && activeMagnetCheckJob.scope === 'collection' && activeMagnetCheckJob.target === expandedCollectionName) {
                updateRenderedMagnetCheckButtons();
                if (expandedMovieId) await refreshMagnetRows(expandedMovieId);
            } else if (runningJob && activeMagnetCheckJob.scope === 'all') {
                updateRenderedMagnetCheckButtons();
                if (expandedMovieId) await refreshMagnetRows(expandedMovieId);
            } else if (runningJob && expandedCollectionName && activeMagnetCheckJob.scope === 'movie') {
                updateRenderedMagnetCheckButtons();
                if (expandedMovieId && String(expandedMovieId) === String(activeMagnetCheckJob.target)) {
                    await refreshMagnetRows(expandedMovieId);
                }
            }
            if (!activeMagnetCheckJob.running) {
                clearInterval(magnetCheckPollInterval);
                magnetCheckPollInterval = null;
                await refreshMagnetCheckTarget(activeMagnetCheckJob);
            }
        }

        async function cancelMagnetCheck(jobId) {
            const res = await apiFetch(`/api/magnet_check_jobs/${encodeURIComponent(jobId)}/cancel`, { method: 'POST' }).then(r => r.json());
            if (res.code === 200) {
                activeMagnetCheckJob = res.data;
                if (expandedCollectionName) renderCollectionBody(expandedCollectionName);
            }
        }

        async function refreshMagnetCheckTarget(job) {
            if (job.scope === 'collection' && expandedCollectionName === job.target) {
                const body = document.getElementById(`collection-body-${job.target}`);
                if (body) body.dataset.loaded = '';
                await reloadCollectionMovies(job.target);
            }
            if (job.scope === 'movie') {
                const movieId = Number(job.target);
                const box = document.getElementById(`magnets-${movieId}`);
                let magnets = [];
                if (box && !box.classList.contains('hidden')) {
                    magnets = await refreshMagnetRows(movieId);
                } else {
                    const res = await apiFetch(`/api/movies/${movieId}/magnets`).then(r => r.json());
                    magnets = res.data || [];
                }
                if (syncSelectedMagnetToMovie(movieId, magnets)) updateMovieSelectedName(movieId, magnets);
                updateRenderedMagnetCheckButtons();
            }
            if (job.scope === 'all') {
                await loadCollections();
                updateRenderedMagnetCheckButtons();
            }
        }

        async function reloadCollectionMovies(collectionName) {
            const res = await apiFetch(`/api/collections/${encodeURIComponent(collectionName)}/movies`).then(r => r.json());
            if (res.code !== 200) return;
            const previousMovieId = expandedMovieId;
            collectionMovieCache[filterKey(collectionName)] = res.data || { movies: [], available_tags: [], total_count: 0 };
            renderCollectionBody(collectionName);
            if (previousMovieId) {
                expandedMovieId = previousMovieId;
                const box = document.getElementById(`magnets-${previousMovieId}`);
                if (box) await loadMagnets(previousMovieId, true);
            }
        }

        async function downloadCsv(name) {
            const response = await apiFetch(`/api/download?name=${encodeURIComponent(name)}${tagsQuery(name)}`);
            if (!response.ok) {
                const data = await response.json().catch(() => ({}));
                return alert(data.msg || '下载失败');
            }
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function copyTaskIncrementalMagnets(taskId) {
            try {
                const res = await apiFetch(`/api/tasks/${encodeURIComponent(taskId)}/incremental_magnets`).then(r => r.json());
                if (res.code !== 200) return alert(res.msg || '读取失败');
                const links = res.data || [];
                if (!links.length) return alert('暂无新增影片磁力可复制');
                const copied = await copyText(links.join('\n'));
                alert(copied ? `已复制 ${links.length} 条新增影片磁力` : '自动复制失败，请在弹窗中手动复制新增影片磁力');
            } catch (err) {
                console.error(err);
                alert(err.message || '复制失败');
            }
        }

        async function copyMagnets(name) {
            try {
                const res = await apiFetch(`/api/magnets?name=${encodeURIComponent(name)}${tagsQuery(name)}`).then(r => r.json());
                if (res.code !== 200) return alert(res.msg || '读取失败');
                const links = res.data || [];
                if (!links.length) return alert('暂无磁力链接可复制');
                const copied = await copyText(links.join('\n'));
                alert(copied ? `已复制 ${links.length} 条磁力链接` : '自动复制失败，请在弹窗中手动复制磁力链接');
            } catch (err) {
                console.error(err);
                alert(err.message || '复制失败');
            }
        }

        async function copyText(text) {
            const value = String(text || '');
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(value);
                    return true;
                } catch (err) {
                    console.warn('Clipboard API failed, falling back to textarea copy.', err);
                }
            }
            const area = document.createElement('textarea');
            area.value = value;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.top = '0';
            area.style.left = '-9999px';
            document.body.appendChild(area);
            area.focus();
            area.select();
            area.setSelectionRange(0, area.value.length);
            let copied = false;
            try {
                copied = document.execCommand('copy');
            } finally {
                document.body.removeChild(area);
            }
            if (!copied) {
                window.prompt('自动复制失败，请手动复制：', value);
            }
            return copied;
        }

        function toggleSelectAll() {
            const checked = document.getElementById('selectAllCheckbox').checked;
            document.querySelectorAll('.collection-checkbox').forEach(cb => cb.checked = checked);
            updateBatchDeleteBtn();
        }

        function updateBatchDeleteBtn() {
            const checked = document.querySelectorAll('.collection-checkbox:checked').length;
            const btn = document.getElementById('batchDeleteBtn');
            const count = document.getElementById('batchDeleteCount');
            btn.disabled = checked === 0;
            btn.setAttribute('aria-label', `批量删除 ${checked} 个数据集合`);
            if (count) count.textContent = checked;
        }

        function batchDelete() {
            const names = Array.from(document.querySelectorAll('.collection-checkbox:checked')).map(cb => cb.value);
            if (names.length) deleteFiles(names);
        }

        async function autoSelectMagnets() {
            const checkedNames = Array.from(document.querySelectorAll('.collection-checkbox:checked')).map(cb => cb.value);
            const names = checkedNames.length ? checkedNames : collectionsCache.map(item => item.name);
            if (!names.length) return alert('暂无可自动选择的集合');
            const scopeText = checkedNames.length ? `${checkedNames.length} 个已选集合` : '全部集合';
            if (!confirm(`按评分自动选择 ${scopeText} 的推荐磁力？`)) return;
            const res = await apiFetch('/api/magnets/auto_select', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filenames: names })
            }).then(r => r.json());
            alert(res.msg || '自动选择完成');
            await loadCollections();
        }

        async function enqueueCollectionIncremental(name, event) {
            if (event) event.stopPropagation();
            if (!confirm(`确定对「${displayName(name)}」执行增量爬取吗？`)) return;
            const res = await apiFetch(`/api/collections/${encodeURIComponent(name)}/incremental_task`, { method: 'POST' }).then(r => r.json());
            if (res.code !== 200) return alert(res.msg || '添加增量任务失败');
            alert(res.msg || '任务已加入队列');
            await refreshMonitor();
        }

        async function deleteFiles(names) {
            if (!confirm(`确定删除 ${names.length} 个数据库集合吗？`)) return;
            const res = await apiFetch('/api/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filenames: names })
            }).then(r => r.json());
            alert(res.msg);
            await loadCollections();
        }

        async function clearLogs() {
            const res = await apiFetch('/api/clear_logs', { method: 'POST' }).then(r => r.json());
            alert(res.msg);
            await refreshMonitor();
        }

        async function refreshAll() {
            await loadRuntimeConfig();
            await refreshMonitor();
            await loadCollections();
            await restoreMagnetCheckJob();
        }

        window.onload = async function() {
            renderRuntimePanelState();
            renderLogPanelState();
            window.addEventListener('resize', () => fitMovieTags());
            document.addEventListener('click', handleDocumentClick);
            document.getElementById('start_url').value = localStorage.getItem('javdb_url') || '';
            document.getElementById('filename').value = localStorage.getItem('javdb_filename') || '';
            document.getElementById('user_agent').value = localStorage.getItem('javdb_ua') || defaultUA();
            try {
                const version = await fetch('/api/version').then(r => r.json());
                document.getElementById('app_version').innerText = version.version || 'v?.?.?';
                authRequired = !!version.auth_required;
                showAuthPanel(authRequired && !apiToken);
            } catch {
                document.getElementById('app_version').innerText = 'v?.?.?';
            }
            await refreshAll();
            pollInterval = setInterval(refreshMonitor, 2500);
        };
    </script>
</body>
</html>
